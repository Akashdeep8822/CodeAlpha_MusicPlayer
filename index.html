<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deck-A — Music Player</title>
<style>
  :root{
    --shell:#2b2823;
    --shell-light:#3d3931;
    --tape-a:#d9c9a3;
    --tape-b:#8a5a3b;
    --reel:#1a1815;
    --amber:#e0a13c;
    --paper:#efe8d8;
    --grey:#948c78;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle at 50% 0%, #423d34, #14120f 70%);
    font-family:'Helvetica Neue', Arial, sans-serif;
    padding:24px;
  }
  .deck{
    width:380px;
    background:linear-gradient(170deg, var(--shell-light), var(--shell));
    border-radius:18px;
    padding:20px;
    box-shadow:0 30px 70px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .deck-label{
    display:flex;
    justify-content:space-between;
    color:var(--grey);
    font-size:10px;
    letter-spacing:.18em;
    text-transform:uppercase;
    margin-bottom:12px;
  }

  .cassette{
    background:var(--tape-a);
    border-radius:10px;
    padding:16px;
    position:relative;
    box-shadow:inset 0 0 0 2px rgba(0,0,0,.08);
  }
  .window{
    background:#241f19;
    border-radius:6px;
    padding:14px 10px;
    display:flex;
    align-items:center;
    justify-content:space-around;
  }
  .reel{
    width:64px; height:64px;
    border-radius:50%;
    background:
      radial-gradient(circle at center, var(--reel) 0 14%, transparent 15%),
      repeating-conic-gradient(var(--tape-b) 0deg 8deg, #6d4429 8deg 16deg);
    display:flex;
    align-items:center;
    justify-content:center;
    animation:spin 3s linear infinite;
    animation-play-state:paused;
    border:3px solid #171410;
  }
  .reel::after{
    content:"";
    width:16px; height:16px;
    background:var(--shell);
    border-radius:50%;
  }
  .playing .reel{ animation-play-state:running; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .label-strip{
    margin-top:12px;
    text-align:center;
  }
  .label-strip .track-title{
    font-family:Georgia, serif;
    font-weight:700;
    font-size:18px;
    color:#241f19;
  }
  .label-strip .track-artist{
    font-size:12px;
    color:#5a4a35;
    letter-spacing:.04em;
  }

  .controls-panel{
    margin-top:18px;
  }

  .progress-row{
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--grey);
    font-size:11px;
    font-variant-numeric:tabular-nums;
  }
  .progress-bar{
    flex:1;
    height:6px;
    background:#171410;
    border-radius:3px;
    position:relative;
    cursor:pointer;
  }
  .progress-fill{
    position:absolute;
    top:0; left:0; height:100%;
    width:0%;
    background:var(--amber);
    border-radius:3px;
  }
  .progress-bar input[type=range]{
    position:absolute;
    inset:0;
    width:100%;
    opacity:0;
    cursor:pointer;
  }

  .transport{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    margin-top:16px;
  }
  .transport button{
    background:var(--shell-light);
    border:1px solid rgba(255,255,255,.08);
    color:var(--paper);
    border-radius:50%;
    width:44px; height:44px;
    font-size:16px;
    cursor:pointer;
    box-shadow:0 3px 0 rgba(0,0,0,.4);
    transition:transform .05s ease;
  }
  .transport button:active{ transform:translateY(3px); box-shadow:none; }
  .transport .play-btn{
    width:56px; height:56px;
    font-size:20px;
    background:var(--amber);
    color:#241f19;
  }

  .volume-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:16px;
    color:var(--grey);
    font-size:14px;
  }
  .volume-row input[type=range]{
    flex:1;
    accent-color:var(--amber);
  }

  .playlist{
    margin-top:18px;
    border-top:1px dashed rgba(255,255,255,.12);
    padding-top:10px;
    max-height:150px;
    overflow-y:auto;
  }
  .playlist-item{
    display:flex;
    justify-content:space-between;
    padding:8px 6px;
    border-radius:6px;
    color:var(--grey);
    font-size:13px;
    cursor:pointer;
  }
  .playlist-item:hover{ background:rgba(255,255,255,.04); }
  .playlist-item.active{
    color:var(--amber);
    background:rgba(224,161,60,.08);
  }
  .playlist-item span.dur{ color:#635c4f; font-size:11px; }

  footer{
    text-align:center;
    margin-top:14px;
    font-size:10px;
    letter-spacing:.1em;
    color:var(--grey);
  }
</style>
</head>
<body>

<div class="deck">
  <div class="deck-label">
    <span>Deck·A</span>
    <span id="statusLabel">Stopped</span>
  </div>

  <div class="cassette" id="cassette">
    <div class="window">
      <div class="reel"></div>
      <div class="reel"></div>
    </div>
    <div class="label-strip">
      <div class="track-title" id="trackTitle">—</div>
      <div class="track-artist" id="trackArtist">—</div>
    </div>
  </div>

  <div class="controls-panel">
    <div class="progress-row">
      <span id="curTime">0:00</span>
      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
        <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
      </div>
      <span id="durTime">0:00</span>
    </div>

    <div class="transport">
      <button id="prevBtn" aria-label="Previous">⏮</button>
      <button id="playBtn" class="play-btn" aria-label="Play">▶</button>
      <button id="nextBtn" aria-label="Next">⏭</button>
    </div>

    <div class="volume-row">
      <span>🔊</span>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.7">
    </div>
  </div>

  <div class="playlist" id="playlist"></div>

  <footer>CodeAlpha Frontend Task 4 — Music Player</footer>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
// SoundHelix demo tracks — public sample audio for demonstration
const tracks = [
  { title:"Night Drive", artist:"SoundHelix", src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
  { title:"Low Static", artist:"SoundHelix", src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
  { title:"Amber Room", artist:"SoundHelix", src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" },
  { title:"Tape Loop", artist:"SoundHelix", src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3" },
];

let currentTrack = 0;
let isPlaying = false;

const audio = document.getElementById('audio');
const cassette = document.getElementById('cassette');
const playBtn = document.getElementById('playBtn');
const trackTitle = document.getElementById('trackTitle');
const trackArtist = document.getElementById('trackArtist');
const statusLabel = document.getElementById('statusLabel');
const progressFill = document.getElementById('progressFill');
const seek = document.getElementById('seek');
const curTime = document.getElementById('curTime');
const durTime = document.getElementById('durTime');
const playlistEl = document.getElementById('playlist');
const volume = document.getElementById('volume');

function formatTime(sec){
  if(isNaN(sec)) return "0:00";
  const m = Math.floor(sec/60);
  const s = Math.floor(sec%60).toString().padStart(2,'0');
  return `${m}:${s}`;
}

function renderPlaylist(){
  playlistEl.innerHTML = tracks.map((t,i)=>`
    <div class="playlist-item ${i===currentTrack?'active':''}" data-index="${i}">
      <span>${t.title} · ${t.artist}</span>
      <span class="dur">${i===currentTrack?'▶':''}</span>
    </div>
  `).join('');
  playlistEl.querySelectorAll('.playlist-item').forEach(item=>{
    item.addEventListener('click', ()=>{
      loadTrack(parseInt(item.dataset.index));
      playAudio();
    });
  });
}

function loadTrack(i){
  currentTrack = (i + tracks.length) % tracks.length;
  const t = tracks[currentTrack];
  audio.src = t.src;
  trackTitle.textContent = t.title;
  trackArtist.textContent = t.artist;
  renderPlaylist();
}

function playAudio(){
  audio.play();
  isPlaying = true;
  playBtn.textContent = "❚❚";
  statusLabel.textContent = "Playing";
  cassette.classList.add('playing');
}
function pauseAudio(){
  audio.pause();
  isPlaying = false;
  playBtn.textContent = "▶";
  statusLabel.textContent = "Paused";
  cassette.classList.remove('playing');
}

playBtn.addEventListener('click', ()=>{
  if(!audio.src) loadTrack(0);
  isPlaying ? pauseAudio() : playAudio();
});

document.getElementById('nextBtn').addEventListener('click', ()=>{
  loadTrack(currentTrack + 1);
  if(isPlaying) playAudio();
});
document.getElementById('prevBtn').addEventListener('click', ()=>{
  loadTrack(currentTrack - 1);
  if(isPlaying) playAudio();
});

audio.addEventListener('loadedmetadata', ()=>{
  durTime.textContent = formatTime(audio.duration);
  seek.max = audio.duration;
});
audio.addEventListener('timeupdate', ()=>{
  curTime.textContent = formatTime(audio.currentTime);
  seek.value = audio.currentTime;
  const pct = (audio.currentTime / audio.duration) * 100 || 0;
  progressFill.style.width = pct + "%";
});
audio.addEventListener('ended', ()=>{
  loadTrack(currentTrack + 1);
  playAudio();
});

seek.addEventListener('input', ()=>{
  audio.currentTime = seek.value;
});

volume.addEventListener('input', ()=>{
  audio.volume = volume.value;
});
audio.volume = volume.value;

// init
loadTrack(0);
renderPlaylist();
</script>

</body>
</html>
